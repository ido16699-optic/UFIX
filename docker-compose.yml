version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ufix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ufix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ufix_password}
      POSTGRES_DB: ${POSTGRES_DB:-ufix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ufix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ufix-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ufix}:${POSTGRES_PASSWORD:-ufix_password}@db:5432/${POSTGRES_DB:-ufix}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ufix-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
