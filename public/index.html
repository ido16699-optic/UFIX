<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFIX - Uber for Handymen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>UFIX</h1>
            <p class="tagline">Connect with Local Handymen Instantly</p>
            <nav id="nav">
                <button id="loginBtn" class="nav-btn">Login</button>
                <button id="registerBtn" class="nav-btn">Register</button>
                <button id="logoutBtn" class="nav-btn" style="display: none;">Logout</button>
            </nav>
        </header>

        <!-- Login Form -->
        <div id="loginForm" class="form-container" style="display: none;">
            <h2>Login</h2>
            <form id="loginFormElement">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
                <button type="button" onclick="showRegister()">Need an account? Register</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-container" style="display: none;">
            <h2>Register</h2>
            <form id="registerFormElement">
                <input type="text" id="registerName" placeholder="Full Name" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <input type="tel" id="registerPhone" placeholder="Phone Number" required>
                
                <label>User Type:</label>
                <select id="registerUserType" required>
                    <option value="customer">Customer</option>
                    <option value="handyman">Handyman</option>
                </select>

                <div id="handymanFields" style="display: none;">
                    <label>Skills (comma-separated):</label>
                    <input type="text" id="registerSkills" placeholder="e.g., plumbing, electrical, carpentry">
                </div>

                <label>Address:</label>
                <input type="text" id="registerAddress" placeholder="Your Address" required>
                
                <label>Latitude:</label>
                <input type="number" step="0.000001" id="registerLat" placeholder="Latitude" value="40.7128" required>
                
                <label>Longitude:</label>
                <input type="number" step="0.000001" id="registerLng" placeholder="Longitude" value="-74.0060" required>
                
                <button type="submit">Register</button>
                <button type="button" onclick="showLogin()">Already have an account? Login</button>
            </form>
        </div>

        <!-- Customer Dashboard -->
        <div id="customerDashboard" class="dashboard" style="display: none;">
            <h2>Welcome, <span id="customerName"></span>!</h2>
            
            <div class="section">
                <h3>Post a New Repair Request</h3>
                <form id="repairRequestForm">
                    <input type="text" id="requestTitle" placeholder="Title (e.g., Fix leaking faucet)" required>
                    <textarea id="requestDescription" placeholder="Description" required></textarea>
                    
                    <label>Category:</label>
                    <select id="requestCategory" required>
                        <option value="plumbing">Plumbing</option>
                        <option value="electrical">Electrical</option>
                        <option value="carpentry">Carpentry</option>
                        <option value="painting">Painting</option>
                        <option value="general">General</option>
                        <option value="other">Other</option>
                    </select>

                    <label>Urgency:</label>
                    <select id="requestUrgency" required>
                        <option value="asap">ASAP</option>
                        <option value="scheduled">Scheduled</option>
                    </select>

                    <div id="scheduledDateField" style="display: none;">
                        <label>Scheduled Date:</label>
                        <input type="datetime-local" id="requestScheduledDate">
                    </div>

                    <label>Budget (optional):</label>
                    <input type="number" id="requestBudgetMin" placeholder="Min Budget">
                    <input type="number" id="requestBudgetMax" placeholder="Max Budget">

                    <label>Address:</label>
                    <input type="text" id="requestAddress" placeholder="Job Address" required>
                    
                    <label>Latitude:</label>
                    <input type="number" step="0.000001" id="requestLat" placeholder="Latitude" value="40.7128" required>
                    
                    <label>Longitude:</label>
                    <input type="number" step="0.000001" id="requestLng" placeholder="Longitude" value="-74.0060" required>

                    <button type="submit">Post Request</button>
                </form>
            </div>

            <div class="section">
                <h3>My Repair Requests</h3>
                <div id="customerRequests"></div>
            </div>
        </div>

        <!-- Handyman Dashboard -->
        <div id="handymanDashboard" class="dashboard" style="display: none;">
            <h2>Welcome, <span id="handymanName"></span>!</h2>
            
            <div class="section">
                <h3>Available Jobs Nearby</h3>
                <div id="availableJobs"></div>
            </div>

            <div class="section">
                <h3>My Offers</h3>
                <div id="myOffers"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
